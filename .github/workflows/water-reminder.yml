name: Water reminder

on:
  schedule:
    # Asia/Shanghai reminders: 11:00, 15:00, 20:00.
    - cron: "0 3 * * *"
    - cron: "0 7 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Create reminder issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          today="$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          time="$(TZ=Asia/Shanghai date +%H:%M)"
          case "$time" in
            11:*) step="第 1 次"; progress="500 / 1500ml" ;;
            15:*) step="第 2 次"; progress="1000 / 1500ml" ;;
            20:*) step="第 3 次"; progress="1500 / 1500ml" ;;
            *) step="测试提醒"; progress="本次测试不计入进度" ;;
          esac

          cat > reminder-body.txt <<EOF
          @laohan6 该喝水啦。

          本次建议：喝水 500ml
          今日目标：1500ml
          当前进度：$progress
          提醒阶段：$step

          小口慢喝就好，别等口渴了再补水。
          EOF

          gh issue create \
            --repo "$REPO" \
            --title "喝水提醒 $today $time" \
            --body-file reminder-body.txt
