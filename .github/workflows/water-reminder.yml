name: Water reminder

on:
  schedule:
    # Asia/Shanghai reminders: 11:00, 15:00, 20:00.
    - cron: "0 3 * * *"
    - cron: "0 7 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare reminder
        run: |
          today="$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          time="$(TZ=Asia/Shanghai date +%H:%M)"
          day_index="$(TZ=Asia/Shanghai date +%j)"
          case "$time" in
            11:*) step="第 1 次"; progress="500 / 1500ml"; slot=0 ;;
            15:*) step="第 2 次"; progress="1000 / 1500ml"; slot=1 ;;
            20:*) step="第 3 次"; progress="1500 / 1500ml"; slot=2 ;;
            *) step="测试提醒"; progress="本次测试不计入进度"; slot=3 ;;
          esac
          flirt_lines=(
            "乖，先把水喝了，再去忙别的。"
            "别装忙，先喝两口水再继续。"
            "今天也要乖一点，水先安排上。"
            "这条提醒不许划走，先把水喝了。"
            "饭饭同学，补水这件事可不能偷懒。"
            "小口慢喝，别让自己干巴巴的。"
          )
          flirt_line="${flirt_lines[$(( (10#$day_index + slot) % ${#flirt_lines[@]} ))]}"

          {
            echo "TODAY=$today"
            echo "TIME=$time"
            echo "SUBJECT=喝水提醒 $today $time"
          } >> "$GITHUB_ENV"

          cat > reminder-body.txt <<EOF
          饭饭同学，该喝水啦。

          这是今天的 $step 喝水小任务：
          本次建议：慢慢喝 500ml
          今日目标：1500ml
          当前进度：$progress

          乖，先放下手头的事，喝几口水再继续忙。
          $flirt_line
          EOF

      - name: Send reminder email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python3 <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          user = os.environ.get("SMTP_USER", "").strip()
          password = os.environ.get("SMTP_PASS", "").strip()
          mail_to = os.environ.get("MAIL_TO", "").strip()
          subject = os.environ.get("SUBJECT", "喝水提醒").strip()

          if not user or not password or not mail_to:
              raise SystemExit("Missing SMTP_USER, SMTP_PASS, or MAIL_TO secret.")

          with open("reminder-body.txt", "r", encoding="utf-8") as f:
              body = f.read()

          msg = EmailMessage()
          msg["From"] = f"Water Reminder <{user}>"
          msg["To"] = mail_to
          msg["Subject"] = subject
          msg.set_content(body)

          context = ssl.create_default_context()
          with smtplib.SMTP_SSL("smtp.qq.com", 465, context=context, timeout=30) as smtp:
              smtp.login(user, password)
              smtp.send_message(msg)
          PY

      - name: Create backup issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "@laohan6 邮件提醒任务已运行。"
            echo
            cat reminder-body.txt
          } > issue-body.txt

          gh issue create \
            --repo "$REPO" \
            --title "$SUBJECT" \
            --body-file issue-body.txt
