name: Water reminder

on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 7 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare reminder
        run: |
          today="$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          time="$(TZ=Asia/Shanghai date +%H:%M)"
          day_index="$(TZ=Asia/Shanghai date +%j)"

          case "$time" in
            11:*) step="第 1 次"; progress="500 / 1500ml"; slot=0; emoji="☀️" ;;
            15:*) step="第 2 次"; progress="1000 / 1500ml"; slot=1; emoji="🌤️" ;;
            20:*) step="第 3 次"; progress="1500 / 1500ml"; slot=2; emoji="🌙" ;;
            *) step="测试提醒"; progress="本次测试不计入进度"; slot=3; emoji="🧪" ;;
          esac

          jokes=(
            "今日小句：节奏越忙，越需要给身体留一点空隙。"
            "今日小句：水不是任务，是状态的底色。"
            "今日小句：把水喝好，很多事会顺一点。"
            "今日小句：人一稳，很多细节就开始清亮。"
            "今日小句：慢一点喝，反而更接近效率。"
            "今日小句：先补水，再继续发力。"
          )
          joke="${jokes[$(( (10#$day_index + slot) % ${#jokes[@]} ))]}"

          encouragers=(
            "你已经把很多事情处理得很漂亮了，也别忘了照顾自己。"
            "真正的稳定，不只来自节奏，也来自把自己放进计划里。"
            "今天做到这里已经很好，继续保持，后面会越来越顺。"
            "能坚持到现在，本身就说明你有很强的分寸和韧性。"
            "每一次按时补水，都是在把状态往更好的方向推一点。"
            "把这杯喝完，今天的你会更从容。"
          )
          encouragement="${encouragers[$(( (10#$day_index + slot) % ${#encouragers[@]} ))]}"

          {
            echo "TODAY=$today"
            echo "TIME=$time"
            echo "SUBJECT=喝水提醒 · $time $emoji"
          } >> "$GITHUB_ENV"

          cat > reminder-body.txt <<EOF
          喝水时间到了。

          今天的 $step 喝水小任务 $emoji
          本次建议：慢慢喝 500ml
          今日目标：1500ml
          当前进度：$progress

          $joke

          $encouragement
          EOF

      - name: Send reminder email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python3 <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          user = os.environ.get("SMTP_USER", "").strip()
          password = os.environ.get("SMTP_PASS", "").strip()
          mail_to = os.environ.get("MAIL_TO", "").strip()
          subject = os.environ.get("SUBJECT", "喝水提醒").strip()

          if not user or not password or not mail_to:
              raise SystemExit("Missing SMTP_USER, SMTP_PASS, or MAIL_TO secret.")

          with open("reminder-body.txt", "r", encoding="utf-8") as f:
              body = f.read()

          msg = EmailMessage()
          msg["From"] = f"Water Reminder <{user}>"
          msg["To"] = mail_to
          msg["Subject"] = subject
          msg.set_content(body)

          context = ssl.create_default_context()
          with smtplib.SMTP_SSL("smtp.qq.com", 465, context=context, timeout=30) as smtp:
              smtp.login(user, password)
              smtp.send_message(msg)
          PY

      - name: Create backup issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "邮件提醒任务已运行。"
            echo
            cat reminder-body.txt
          } > issue-body.txt

          gh issue create \
            --repo "$REPO" \
            --title "$SUBJECT" \
            --body-file issue-body.txt
