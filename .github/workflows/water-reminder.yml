name: Water reminder

on:
  schedule:
    # Asia/Shanghai reminders: 11:00, 15:00, 20:00.
    - cron: "0 3 * * *"
    - cron: "0 7 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Create reminder issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          today="$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          time="$(TZ=Asia/Shanghai date +%H:%M)"
          case "$time" in
            11:*) step="第 1 次"; progress="500 / 1500ml" ;;
            15:*) step="第 2 次"; progress="1000 / 1500ml" ;;
            20:*) step="第 3 次"; progress="1500 / 1500ml" ;;
            *) step="测试提醒"; progress="本次测试不计入进度" ;;
          esac

          cat > reminder-body.txt <<EOF
          @laohan6 宝贝，该喝水啦。

          这是今天的 $step 喝水小任务：
          本次建议：慢慢喝 500ml
          今日目标：1500ml
          当前进度：$progress

          乖，先放下手头的事，喝几口水再继续忙。
          不许偷偷忽略这条提醒，今天也要好好照顾自己。
          EOF

          gh issue create \
            --repo "$REPO" \
            --title "喝水提醒 $today $time" \
            --body-file reminder-body.txt
